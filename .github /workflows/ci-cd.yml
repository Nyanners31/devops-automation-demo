name: DevOps DevOps CI/CD Pipeline

# Trigger 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Codetest
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint Code with Flake8
        run: |
          pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  #Package the Application into Docker
  build-docker-image:
    needs: test-and-lint 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-docker@v1
        with:
          docker-version: '24.0.7'

      # Build the Docker container 
      - name: Build Local Docker Image
        run: |
          docker build -t my-devops-app:${{ github.sha }} .
          echo "Docker Build Completed Successfully!"

  # Deployment
  deploy-to-staging:
    needs: build-docker-image 
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Cloud Deployment
        run: |
          echo "Simulating deployment to AWS/GCP cloud environment..."
          echo "Deploying container version: ${{ github.sha }}"
          echo "Application is live and verified!"
